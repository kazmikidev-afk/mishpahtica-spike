<style>

body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}

h2{font-size:1.15rem;margin:18px 0 8px}

button.danger{background:#fde8e8;color:#b42318}

button.sm{padding:6px 12px;min-height:34px;font-size:.9rem;border-radius:10px}

label{display:block;font-size:.88rem;color:var(--mute);margin:12px 0 4px}

.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.mute{color:var(--mute);font-size:.88rem}

.bar>i{display:block;height:100%;background:linear-gradient(90deg,#5b8cff,#1f9d63);border-radius:99px;transition:width .5s}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.9rem}
.ring.full{animation:pop .6s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}

.chips button.on{background:var(--pri);color:#fff}

.pin{letter-spacing:.6em;text-align:center;font-size:1.8rem;direction:ltr}

.tabs button.on{background:var(--pri);color:#fff}
.dayrow{display:flex;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dayrow:last-child{border:0}
.dn{width:54px;font-weight:700;flex:none}
.dot{display:inline-flex;align-items:center;gap:3px;background:#f1f4fa;border-radius:99px;padding:2px 9px;font-size:.8rem}
.dot.d{background:var(--ok2);color:#146c43}.dot.p{background:#eceff5;color:var(--mute)}.dot.c{background:var(--warn2);color:#8a5a00}
.confetti{position:fixed;left:50%;top:40%;font-size:2.4rem;pointer-events:none;z-index:90;animation:fly 1.1s ease-out forwards}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--x),-170px) scale(1.4)}}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.switch input{width:auto;min-height:0;transform:scale(1.5)}
.center{text-align:center}
.hide{display:none}
@media(max-width:380px){body{font-size:16px}}
</style>
